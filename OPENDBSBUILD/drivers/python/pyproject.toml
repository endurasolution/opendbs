[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendbs"
version = "1.0.1"
description = "Official Python client for OpenDBS (documents, SQL, aggregation, transactions)"
requires-python = ">=3.8"
license = { text = "CC-BY-NC-4.0" }
dependencies = []

[tool.setuptools]
packages = ["opendbs"]
