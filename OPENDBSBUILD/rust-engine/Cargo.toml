[package]
name = "opendbs-engine"
version = "0.2.0"
edition = "2021"
authors = ["OpenDBS Team"]
description = "Rust-accelerated full-text and vector search index for OpenDBS"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API bindings for Node.js
napi = "2.16"
napi-derive = "2.16"

# Serialization / persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
snap = "1.1"

# Parallel processing (used for bulk text/vector indexing)
rayon = "1.8"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.5"

# Fuzzy text matching (trigram candidate reranking)
strsim = "0.11"

# Approximate nearest-neighbor vector index
hnsw_rs = "0.3.4"

# Disk storage engine: ACID, crash-safe B-tree with a bounded page cache
redb = "2"
# Page-level encryption at rest (AES-256-XTS, the standard for disk encryption)
aes = "0.8"
xts-mode = "0.5"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
